
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/register.css">

    <!-- Google Fonts -->
    <link href="https://apis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">


    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="background"></div>

<div class="register-card">

    <div class="logo">
        <i class="fas fa-user-plus"></i>
    </div>

    <h2>Create Account</h2>

    <p class="subtitle">
        Join Investment Portfolio Management System
    </p>

    <form id="registerForm">

        <div class="input-group">

            <label for="username" hidden>Username</label>

            <i class="fas fa-user"></i>

            <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required>
        </div>
        <small id="usernameError"
               class="error-message"></small>

        <div class="input-group">

            <label for="email" hidden>Email</label>

            <i class="fas fa-envelope"></i>

            <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required>
        </div>
        <small id="emailError"
               class="error-message"></small>


        <div class="input-group">

            <label for="role" hidden>Role</label>

            <i class="fas fa-user-tag"></i>

            <select id="role" required>
                <option value="">Select Role</option>
                <option value="ADVISOR">Advisor</option>
                <option value="INVESTOR">Investor</option>
            </select>

        </div>
        <small id="roleError"
               class="error-message"></small>

        <div class="input-group">

            <label for="password" hidden>Password</label>

            <i class="fas fa-lock"></i>

            <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

            <i class="fas fa-eye toggle"
               onclick="togglePassword('password')"></i>

        </div>
        <small id="passwordError" class="error-message"></small>

        <div class="input-group">

            <label for="confirmPassword" hidden>Confirm Password</label>

            <i class="fas fa-lock"></i>

            <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

            <i class="fas fa-eye toggle"
               onclick="togglePassword('confirmPassword')"></i>

        </div>
        <small id="confirmPasswordError"
               class="error-message"></small>

        <button type="submit" class="register-btn">
            Register
        </button>
        <small id="registerError"
               class="error-message"></small>

    </form>

    <p class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script>

    function togglePassword(id) {

        const field =
            document.getElementById(id);

        field.type =
            field.type === "password"
                ? "text"
                : "password";
    }

    document.getElementById("registerForm")
        .addEventListener("submit", function (event) {

            event.preventDefault();

            document.getElementById("usernameError").textContent = "";
            document.getElementById("emailError").textContent = "";
            document.getElementById("roleError").textContent = "";
            document.getElementById("passwordError").textContent = "";
            document.getElementById("confirmPasswordError").textContent = "";
            document.getElementById("registerError").textContent = "";

            let username =
                document.getElementById("username")
                    .value.trim();

            let email =
                document.getElementById("email")
                    .value.trim();

            let role =
                document.getElementById("role")
                    .value;

            let password =
                document.getElementById("password")
                    .value;

            let confirmPassword =
                document.getElementById("confirmPassword")
                    .value;

            if (username === "") {

                document.getElementById(
                    "usernameError"
                ).textContent =
                    "Username is required";

                return;
            }

            if (email === "") {

                document.getElementById(
                    "emailError"
                ).textContent =
                    "Email is required";

                return;
            }

            if (role === "") {

                document.getElementById(
                    "roleError"
                ).textContent =
                    "Please select a role";

                return;
            }

            if (password === "") {

                document.getElementById(
                    "passwordError"
                ).textContent =
                    "Password is required";

                return;
            }

            const passwordPattern =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}$/;

            if (!passwordPattern.test(password)) {

                document.getElementById(
                    "passwordError"
                ).textContent =
                    "Password must contain at least 6 characters, one uppercase letter, one lowercase letter and one number.";

                return;
            }

            if (password !== confirmPassword) {

                document.getElementById(
                    "confirmPasswordError"
                ).textContent =
                    "Passwords do not match";

                return;
            }

            const user = {

                username: username,
                email: email,
                password: password,
                role: role.toUpperCase()
            };

            fetch(
                "http://localhost:8083/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(user)
                }
            )

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Registration Failed"
                    );
                }

                return response.json();
            })

            .then(data => {

                const message =
                    document.getElementById(
                        "registerError"
                    );

                message.style.color =
                    "#22c55e";

                message.textContent =
                    "Registration successful. Redirecting to login...";

                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 1500);

            })

            .catch(error => {

                document.getElementById(
                    "registerError"
                ).textContent =
                    "Registration failed. Username may already exist.";

            });

        });

</script>


</body>
</html>
