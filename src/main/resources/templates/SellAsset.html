<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Asset</title>
    <link rel="stylesheet" th:href="@{/css/Transaction.css}">
    <script defer th:src="@{/js/Transaction.js}"></script>
</head>
<body>

<header>
    <h2>Investment Portfolio Management System</h2>
    <div>Welcome, <span th:text="${user.username}">Investor</span></div>
</header>

<div class="container">
    <h2>Sell Asset</h2>

    <p class="failed" th:if="${error}" th:text="${error}"></p>
    <p th:if="${#lists.isEmpty(assets)}">
        You do not have an active asset to sell.
        <a th:href="@{/assets}">View your assets</a>
    </p>

    <form th:unless="${#lists.isEmpty(assets)}"
          th:action="@{/transactions/sell}"
          th:object="${transaction}"
          method="post"
          onsubmit="return validateSellForm()">

        <label for="assetId">Asset</label>
        <select id="assetId" th:field="*{assetId}" required>
            <option value="">Select an asset</option>
            <option th:each="asset : ${assets}"
                    th:value="${asset.assetId}"
                    th:data-price="${asset.currentPrice}"
                    th:text="|${asset.assetName} (ID: ${asset.assetId}, available: ${asset.quantity})|">
            </option>
        </select>

        <label for="quantity">Quantity</label>
        <input type="number"
               id="quantity"
               th:field="*{quantity}"
               min="1"
               placeholder="Enter quantity"
               required>

        <label for="price">Selling price per unit</label>
        <input type="number"
               id="price"
               th:field="*{price}"
               min="0.01"
               step="0.01"
               placeholder="Select an asset to view its price"
               readonly
               required>

        <button type="submit">Sell Asset</button>
        <button type="button"
                onclick="window.location.href='/transactions'">
            Back
        </button>
    </form>
</div>
</body>
</html>
