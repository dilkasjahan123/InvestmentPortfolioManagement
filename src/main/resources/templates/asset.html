<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../static/css/asset.css">
</head>

<body>

<nav class="navbar navbar-dark custom-navbar">
    <div class="container">

        <span class="navbar-brand fw-bold">

            <i class="bi bi-briefcase-fill"></i>

            Asset Management

        </span>

        <button
                id="addAssetBtn"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#addAssetModal">

            Add Asset

        </button>

    </div>
</nav>
<div class="container mt-3">
    <div id="message"></div>
</div>
<section class="hero-section">

    <div class="container">

        <h1>Investment Assets Dashboard</h1>

        <p>
            Manage and monitor your portfolio assets.
        </p>

    </div>

</section>
<div class="container mt-4">

    <div class="row">

        <div class="col-md-4">

            <div class="card summary-card assets-card">

                <div class="card-body text-center">

                    <h5>
                        <i class="bi bi-box-seam"></i>
                        Total Assets
                    </h5>

                    <h3 id="totalAssets">0</h3>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card summary-card quantity-card">

                <div class="card-body text-center">

                    <h5>
                        <i class="bi bi-layers"></i>
                        Total Quantity
                    </h5>

                    <h3 id="totalQuantity">0</h3>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card summary-card profit-card">

                <div class="card-body text-center">

                    <h5>
                        <i class="bi bi-graph-up-arrow"></i>
                        Total Profit
                    </h5>

                    <h3 id="totalProfit">₹0.00</h3>

                </div>

            </div>

        </div>

    </div>

</div>
<div class="container my-5">

    <div class="row mb-4">

        <div class="ccontainer my-4">

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-search"></i>

                </span>

                <input
                        type="text"
                        id="assetSearch"
                        class="form-control"
                        placeholder="Search asset name..."
                        onkeyup="loadAssets()">

            </div>

        </div>

    </div>

    <div id="assetContainer"
         class="row">

    </div>

</div>


<!-- Add Asset Modal -->

<div class="modal fade"
     id="addAssetModal">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Add Asset
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">
                <input type="text"
                       id="assetName"
                       class="form-control mb-3"
                       placeholder="Asset Name">
                <select id="portfolioId"
                        class="form-select mb-3">

                    <option value="">
                        Select Portfolio
                    </option>

                </select>


                <select id="assetType"
                        class="form-select mb-3">

                    <option value="Stock">Stock</option>
                    <option value="Bond">Bond</option>
                    <option value="Mutual_Fund">Mutual Fund</option>

                </select>

                <input type="number"
                       id="quantity"
                       class="form-control mb-3"
                       placeholder="Quantity">

                <input type="number"
                       id="purchasePrice"
                       class="form-control mb-3"
                       placeholder="Purchase Price">

                <input type="number"
                       id="currentPrice"
                       class="form-control"
                       placeholder="Current Price">

            </div>

            <div class="modal-footer">

                <button class="btn btn-primary"
                        onclick="addAsset()">

                    Save Asset

                </button>

            </div>

        </div>

    </div>

</div>

<!-- Update Modal -->

<div class="modal fade"
     id="updateModal">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Update Asset
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input type="hidden"
                       id="updateAssetId">
                <input type="text"
                       id="updateAssetName"
                       class="form-control mb-3"
                       placeholder="Asset Name">
                <select id="updatePortfolioId"
                        class="form-select mb-3">

                    <option value="">
                        Select Portfolio
                    </option>

                </select>


                <select id="updateType"
                        class="form-select mb-3">

                    <option value="Stock">Stock</option>
                    <option value="Bond">Bond</option>
                    <option value="Mutual_Fund">Mutual Fund</option>

                </select>

                <input type="number"
                       id="updateQuantity"
                       class="form-control mb-3"
                       disabled>

                <input type="number"
                       id="updatePurchasePrice"
                       class="form-control mb-3">

                <input type="number"
                       id="updateCurrentPrice"
                       class="form-control">

            </div>

            <div class="modal-footer">

                <button class="btn btn-success"
                        onclick="updateAsset()">

                    Update Asset

                </button>

            </div>

        </div>

    </div>

</div>
<!-- Delete Confirmation Modal -->

<div class="modal fade"
     id="deleteModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Confirm Delete
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                Are you sure you want to delete this asset?

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button class="btn btn-danger"
                        id="confirmDeleteBtn">

                    Delete

                </button>

            </div>

        </div>

    </div>

</div>

<script src="../static/js/asset.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
