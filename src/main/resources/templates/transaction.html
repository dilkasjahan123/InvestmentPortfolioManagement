<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Transaction Management</title>

    <link rel="stylesheet" href="../static/css/transaction.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="header">

        <div>

            <h1>
                <i class="fas fa-receipt"></i>
                Transaction Management
            </h1>

            <p>
                View and manage asset transactions
            </p>

        </div>

    </div>

    <div class="search-bar">

        <i class="fas fa-search"></i>

        <input
                type="text"
                id="searchInput"
                placeholder="Search Asset..."
                onkeyup="searchTransaction()">

    </div>

    <div id="transactionContainer"
         class="transaction-grid">

    </div>

</div>

<!-- Modal -->

<div id="transactionModal"
     class="modal">

    <div class="modal-content">

        <h2>Create Transaction</h2>

        <form id="transactionForm">

            <select id="assetId"
                    required>

                <option value="">
                    Select Asset
                </option>

            </select>

            <select id="transactionType"
                    required>

                <option value="">
                    Select Type
                </option>

                <option value="BUY">
                    BUY
                </option>

                <option value="SELL">
                    SELL
                </option>

            </select>

            <input type="number"
                   id="quantity"
                   placeholder="Quantity"
                   required>

            <input type="number"
                   id="price"
                   placeholder="Price"
                   step="0.01"
                   required>

            <div class="modal-buttons">

                <button type="submit">
                    Save
                </button>

                <button
                        type="button"
                        onclick="closeModal()">

                    Cancel

                </button>

            </div>

        </form>

    </div>

</div>

<script src="../static/js/transaction.js"></script>

</body>

</html>
