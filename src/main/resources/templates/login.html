
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Portfolio Management System</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/login.css">
    <!-- Google Fonts -->
    <link href="https://apis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="background"></div>
<div class="login-container">
    <div class="left-panel">
        <h1>Investment Portfolio Management</h1>
        <p>
            Manage portfolios, monitor assets,
            track performance and make smarter
            investment decisions.
        </p>

        <div class="stats">

            <div class="stat-card">
                <i class="fas fa-chart-line"></i>
                <span>Analytics</span>
            </div>

            <div class="stat-card">
                <i class="fas fa-wallet"></i>
                <span>Portfolio</span>
            </div>

            <div class="stat-card">
                <i class="fas fa-shield-alt"></i>
                <span>Secure Access</span>
            </div>

        </div>

    </div>

    <div class="login-card">

        <div class="logo">
            <i class="fas fa-coins"></i>
        </div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Sign in to your account
        </p>

        <form>

            <div class="input-group">

                <label for="username" hidden>Username</label>

                <i class="fas fa-user"></i>

                <input type="text"
                       id="username"
                       placeholder="Username"
                       required>
            </div>

            <div class="input-group">

                <label for="password" hidden>Password</label>

                <i class="fas fa-lock"></i>

                <input type="password"
                       id="password"
                       placeholder="Password"
                       required>

                <i class="fas fa-eye toggle-password"
                   onclick="togglePassword()"></i>

            </div>

            <div class="input-group">

                <label for="role" hidden>Role</label>

                <i class="fas fa-user-tag"></i>

                <select id="role" required>
                    <option value="">Select Role</option>
                    <option value="ADMIN">Admin</option>
                    <option value="ADVISOR">Advisor</option>
                    <option value="INVESTOR">Investor</option>
                </select>

            </div>

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

            </div>

            <button type="button"
                    class="login-btn"
                    onclick="loginUser()">
                Login
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</div>

<script>

    function togglePassword() {

        const password =
            document.getElementById(
                "password"
            );

        password.type =
            password.type === "password"
                ? "text"
                : "password";
    }

    function loginUser() {

        let username =
            document.getElementById(
                "username"
            ).value.trim();

        let password =
            document.getElementById(
                "password"
            ).value.trim();

        let role =
            document.getElementById(
                "role"
            ).value;

        if (
            username === "" ||
            password === "" ||
            role === ""
        ) {

            alert(
                "Please fill all fields"
            );

            return;
        }

        const user = {

            username: username,

            password: password
        };

        fetch(
            "http://localhost:8083/auth/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(user)
            }
        )

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Invalid Login"
                );
            }

            return response.json();
        })

        .then(data => {

            if (
                data.role !== role
            ) {

                alert(
                    "Selected role does not match account role"
                );

                return;
            }

            localStorage.setItem(
                "loggedUser",
                JSON.stringify(data)
            );

            alert(
                "Login Successful"
            );

            switch (data.role) {

                case "ADMIN":

                    window.location.href =
                        "admin.html";
                    break;

                case "ADVISOR":

                    window.location.href =
                        "advisor.html";
                    break;

                case "INVESTOR":

                    window.location.href =
                        "investor-dashboard.html";
                    break;

                default:

                    alert(
                        "Role Not Found"
                    );
            }

        })

        .catch(error => {

            alert(
                "Invalid Username or Password"
            );
        });
    }

</script>

</body>

</html>
